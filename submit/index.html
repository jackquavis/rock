<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutgers Climbing — Tryout Scorecard</title>
  <style>
    :root {
      --scarlet: #cc0033;
      --scarlet-dark: #990026;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-light: #f5f5f5;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --success: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding: 20px 15px; display: flex; justify-content: center; align-items: flex-start; }
    
    .container { width: 100%; max-width: 550px; background: var(--card-bg); border-radius: 12px; padding: 24px; border: 1px solid var(--border-color); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    .header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid var(--scarlet); padding-bottom: 16px; }
    .header h1 { font-size: 1.6rem; color: #fff; margin-bottom: 4px; }
    .header p { color: var(--text-muted); font-size: 0.9rem; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: var(--text-muted); }
    
    input, select, textarea {
      width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid var(--border-color);
      border-radius: 6px; color: #fff; font-size: 1rem; transition: border-color 0.2s;
    }
    input[readonly] { background: #1a1a1a; color: var(--text-muted); cursor: not-allowed; border-color: #2a2a2a; }
    input[type="file"] { padding: 8px; background: #252525; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--scarlet); }

    .climb-card {
      background: #252525;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .climb-card-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--scarlet);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .climb-card select { margin-bottom: 8px; }

    .btn-submit {
      width: 100%; padding: 14px; background: var(--scarlet); color: white; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px;
    }
    .btn-submit:hover { background: var(--scarlet-dark); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; text-align: center; display: none; }
    .alert-success { background: var(--success); color: #fff; }
    .alert-error { background: #b71c1c; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Rutgers Climbing Team</h1>
      <p>Tryout Scorecard Submission</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="scoreForm">
      <div class="form-group">
        <label for="eventName">Current Event</label>
        <input type="text" id="eventName" value="Loading active event..." readonly required />
        <input type="hidden" id="eventId" />
      </div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Jane Doe" required />
      </div>

      <div class="form-group">
        <label for="email">Rutgers Email</label>
        <input type="email" id="email" placeholder="netid@rutgers.edu" required />
      </div>

      <div class="form-group">
        <label for="discordUsername">Discord Username</label>
        <input type="text" id="discordUsername" placeholder="e.g. climber_joe" required />
      </div>

      <div class="form-group">
        <label for="discipline">Discipline</label>
        <select id="discipline" required>
          <option value="Bouldering">Bouldering (Top 5 Climbs)</option>
          <option value="Top Rope">Top Rope (Top 3 Climbs)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="">Select Category</option>
        </select>
      </div>

      <hr style="border-color: var(--border-color); margin: 20px 0;" />

      <label id="climbsHeaderTitle" style="margin-bottom: 12px;">Top Climbs Log</label>

      <div id="climbsContainer">
        <!-- Climb cards generated dynamically -->
      </div>

      <div class="form-group">
        <label for="notes">Notes / Comments (Optional)</label>
        <textarea id="notes" rows="2" placeholder="Any details about your climbs..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Submit Scorecard</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIIbSN2nBnpf946yLNCS9vfq41dWb-w2I",
      authDomain: "tryouts-scoring.firebaseapp.com",
      projectId: "tryouts-scoring",
      storageBucket: "tryouts-scoring.firebasestorage.app",
      messagingSenderId: "56954072644",
      appId: "1:56954072644:web:5c95da0c0edf35be649611"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const defaultBoulderingGrades = [
      { grade: "V0-V2", points: 10 },
      { grade: "V3-V4", points: 25 },
      { grade: "V5-V6", points: 50 },
      { grade: "V7-V8", points: 75 },
      { grade: "V9+", points: 100 }
    ];

    const defaultTopRopeGrades = [
      { grade: "5.6", points: 5 },
      { grade: "5.7", points: 10 },
      { grade: "5.8", points: 15 },
      { grade: "5.9", points: 20 },
      { grade: "5.10a", points: 30 },
      { grade: "5.10b", points: 35 },
      { grade: "5.11a", points: 50 }
    ];

    let activeBoulderingGrades = defaultBoulderingGrades;
    let activeTopRopeGrades = defaultTopRopeGrades;

    const eventNameInput = document.getElementById("eventName");
    const eventIdInput = document.getElementById("eventId");
    const categorySelect = document.getElementById("category");
    const disciplineSelect = document.getElementById("discipline");
    const climbsContainer = document.getElementById("climbsContainer");
    const climbsHeaderTitle = document.getElementById("climbsHeaderTitle");

    async function loadActiveEvent() {
      try {
        let q = query(collection(db, "events"), where("isActive", "==", true), limit(1));
        let snapshot = await getDocs(q);

        if (snapshot.empty) {
          q = query(collection(db, "events"), orderBy("createdAt", "desc"), limit(1));
          snapshot = await getDocs(q);
        }

        if (snapshot.empty) {
          eventNameInput.value = "General Tryouts";
          eventIdInput.value = "general";
          populateCategories(["Men", "Women"]);
          renderClimbCards();
          return;
        }

        const activeDoc = snapshot.docs[0];
        const data = activeDoc.data();

        eventNameInput.value = data.name || "General Tryouts";
        eventIdInput.value = activeDoc.id;

        if (data.boulderingGrades && data.boulderingGrades.length > 0) activeBoulderingGrades = data.boulderingGrades;
        if (data.topRopeGrades && data.topRopeGrades.length > 0) activeTopRopeGrades = data.topRopeGrades;

        const categories = (data.categories && data.categories.length > 0) ? data.categories : ["Men", "Women"];
        populateCategories(categories);
        renderClimbCards();
      } catch (err) {
        console.error("Error loading active event:", err);
        eventNameInput.value = "General Tryouts";
        eventIdInput.value = "general";
        populateCategories(["Men", "Women"]);
        renderClimbCards();
      }
    }

    function populateCategories(categoriesList) {
      categorySelect.innerHTML = `<option value="">Select Category</option>`;
      categoriesList.forEach(cat => {
        categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function renderClimbCards() {
      const discipline = disciplineSelect.value;
      const count = discipline === "Top Rope" ? 3 : 5;
      const gradeList = discipline === "Top Rope" ? activeTopRopeGrades : activeBoulderingGrades;

      climbsHeaderTitle.innerText = `Top ${count} Climbs Log (${discipline})`;
      climbsContainer.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const card = document.createElement("div");
        card.className = "climb-card";
        card.innerHTML = `
          <div class="climb-card-title">Climb ${i}</div>
          <select class="climb-grade" id="grade-${i}" required>
            <option value="">Select Grade</option>
            ${gradeList.map(g => `<option value="${g.grade}">${g.grade}</option>`).join('')}
          </select>
          <input type="file" class="climb-file" id="file-${i}" accept="image/*" />
        `;
        climbsContainer.appendChild(card);
      }
    }

    disciplineSelect.addEventListener("change", renderClimbCards);
    loadActiveEvent();

    const form = document.getElementById("scoreForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      alertBox.style.display = "none";

      const discipline = disciplineSelect.value;
      const count = discipline === "Top Rope" ? 3 : 5;
      const gradeList = discipline === "Top Rope" ? activeTopRopeGrades : activeBoulderingGrades;
      const climbsData = [];
      let calculatedTotalPoints = 0;

      try {
        for (let i = 1; i <= count; i++) {
          const gradeSelect = document.getElementById(`grade-${i}`);
          const fileInput = document.getElementById(`file-${i}`);
          const selectedGrade = gradeSelect ? gradeSelect.value : "";
          
          const matchedGradeObj = gradeList.find(g => g.grade === selectedGrade);
          const pointsValue = matchedGradeObj ? parseInt(matchedGradeObj.points, 10) : 0;
          
          calculatedTotalPoints += pointsValue;

          const file = fileInput && fileInput.files ? fileInput.files[0] : null;
          let photoUrl = "";

          if (file) {
            submitBtn.innerText = `Uploading photo for Climb ${i}...`;
            const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
            const storageRef = ref(storage, `proofs/climb_${i}_${Date.now()}_${cleanFileName}`);
            
            await uploadBytes(storageRef, file);
            photoUrl = await getDownloadURL(storageRef);
          }

          climbsData.push({
            climbNumber: i,
            grade: selectedGrade || "N/A",
            points: pointsValue,
            photoUrl: photoUrl
          });
        }

        submitBtn.innerText = "Saving scorecard...";

        await addDoc(collection(db, "submissions"), {
          eventId: eventIdInput.value,
          eventName: eventNameInput.value,
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          discordUsername: document.getElementById("discordUsername").value.trim(),
          discipline: discipline,
          category: categorySelect.value,
          climbs: climbsData,
          totalPoints: calculatedTotalPoints,
          notes: document.getElementById("notes").value.trim(),
          timestamp: serverTimestamp()
        });

        alertBox.className = "alert alert-success";
        alertBox.innerText = "Scorecard submitted successfully!";
        alertBox.style.display = "block";
        form.reset();
        loadActiveEvent();
      } catch (err) {
        console.error(err);
        alertBox.className = "alert alert-error";
        alertBox.innerText = "Error submitting scorecard. Please check your network.";
        alertBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Scorecard";
      }
    });
  </script>
</body>
</html>
