<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body class="links-page-body">

  <div class="links-container" id="links-app" style="position: relative; padding: 2.5rem 2rem 2rem 2rem; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); margin: 2rem auto; max-width: 500px;">
    
    <!-- Top Right Instagram Icon -->
    <a href="https://www.instagram.com/rurockclimbing/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" style="position: absolute; top: 1.25rem; right: 1.25rem; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; opacity: 0.85; transition: opacity 0.2s ease, transform 0.2s ease;" onmouseover="this.style.opacity='1'; this.style.transform='scale(1.1)';" onmouseout="this.style.opacity='0.85'; this.style.transform='scale(1)';">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
    </a>

    <!-- Profile Section (Dynamic) -->
    <div class="profile-header">
      <div class="profile-avatar">
        <img id="profile-img" src="/assets/RURC_Logo_White_BG.jpg" alt="Rutgers Rock Climbing Team">
      </div>
      <h1 id="profile-title">RuRockclimbing</h1>
      <p class="profile-bio" id="profile-bio">Loading profile...</p>
    </div>

    <!-- Links List (Dynamic) -->
    <div class="links-list" id="links-list-container">
      <p style="text-align: center; color: rgba(255,255,255,0.7);">Loading links...</p>
    </div>
  </div>

  <script>
    // Fetch and render data directly from Pages CMS JSON output
    fetch('/data/links.json')
      .then(response => response.json())
      .then(data => {
        const items = data.links || [];
        const container = document.getElementById('links-list-container');
        container.innerHTML = '';

        items.forEach(item => {
          const itemType = (item.type || '').toLowerCase().trim();

          if (itemType === 'profile') {
            if (item.title) {
              document.getElementById('profile-title').textContent = item.title;
            }
            if (item.description) {
              document.getElementById('profile-bio').innerHTML = item.description;
            }
          } 
          else if (itemType === 'featured') {
            const card = document.createElement('a');
            card.href = item.url || '#';
            card.className = 'featured-link-card';
            card.target = '_blank';
            card.innerHTML = `
              <div class="featured-card-content">
                <h3>${item.title || ''}</h3>
                <p>${item.description || ''}</p>
                <span class="btn-learn-more">${item.text || 'Learn More'}</span>
              </div>
            `;
            container.appendChild(card);
          } 
          else if (itemType === 'button') {
            const btn = document.createElement('a');
            btn.href = item.url || '#';
            btn.className = 'link-button';
            btn.target = '_blank';
            btn.innerHTML = `<span>${item.text || item.title || 'Link'}</span>`;
            container.appendChild(btn);
          }
        });
      })
      .catch(error => {
        console.error('Error loading links data:', error);
        document.getElementById('links-list-container').innerHTML = '<p style="text-align:center; color: #ffcccc;">Failed to load links.</p>';
      });
  </script>

</body>
</html>
