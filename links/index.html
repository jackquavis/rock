<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuRockclimbing - Links</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="links-page-body">

  <div class="links-container" id="links-app" style="position: relative; padding: 2.5rem 2rem 2rem 2rem; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); margin: 2rem auto; max-width: 500px;">
    
    <!-- Top Right Instagram Icon -->
    <a href="https://www.instagram.com/rurockclimbing/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" style="position: absolute; top: 1.25rem; right: 1.25rem; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; opacity: 0.85; transition: opacity 0.2s ease, transform 0.2s ease;" onmouseover="this.style.opacity='1'; this.style.transform='scale(1.1)';" onmouseout="this.style.opacity='0.85'; this.style.transform='scale(1)';">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
    </a>

    <!-- Profile Section (Dynamic) -->
    <div class="profile-header">
      <div class="profile-avatar">
        <img id="profile-img" src="/assets/RURC_Logo_White_BG.jpg" alt="Rutgers Rock Climbing Team">
      </div>
      <h1 id="profile-title">RuRockclimbing</h1>
      <p class="profile-bio" id="profile-bio">Loading profile...</p>
    </div>

    <!-- Links List (Dynamic) -->
    <div class="links-list" id="links-list-container">
      <p style="text-align: center; color: rgba(255,255,255,0.7);">Loading links...</p>
    </div>
  </div>

  <script>
    // Paste your Published Google Sheet CSV URL here
    const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS5v0bgyBhsan_cjBcKNXi0FzNs-RQmx9BFffmSEOKIib_WzD21sRJQY32iYzpOOZWAqbq_yMeUsPHG/pub?output=csv';

    // Robust CSV line parser that correctly handles commas inside quotes
    function parseCSVLine(line) {
      const values = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        let char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          values.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      values.push(current);
      return values.map(v => v.trim().replace(/^"(.*)"$/, '$1'));
    }

    function parseCSV(text) {
      let lines = text.split(/\r\n|\n/);
      let result = [];
      if (lines.length === 0) return result;
      
      let headers = parseCSVLine(lines[0]);
      
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let currentLine = parseCSVLine(lines[i]);
        let obj = {};
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = currentLine[j] ? currentLine[j].trim() : '';
        }
        result.push(obj);
      }
      return result;
    }

    // Fetch and render data from Google Sheet
    fetch(sheetCSVUrl)
      .then(response => response.text())
      .then(csvText => {
        const rows = parseCSV(csvText);
        const container = document.getElementById('links-list-container');
        container.innerHTML = '';

        rows.forEach(row => {
          const rowType = (row.type || '').toLowerCase().trim();

          if (rowType === 'profile') {
            if (row.title) {
              document.getElementById('profile-title').textContent = row.title;
            }
            if (row.description) {
              document.getElementById('profile-bio').innerHTML = row.description;
            }
            const customImage = row.image || row.url;
            if (customImage && customImage.startsWith('http')) {
              document.getElementById('profile-img').src = customImage;
            }
          } 
          else if (rowType === 'featured') {
            const card = document.createElement('a');
            card.href = row.url || '#';
            card.className = 'featured-link-card';
            card.target = '_blank';
            card.innerHTML = `
              <div class="featured-card-icon">
                <span>${row.icon || 'RU'}</span>
              </div>
              <div class="featured-card-content">
                <h3>${row.title || ''}</h3>
                <p>${row.description || ''}</p>
                <span class="btn-learn-more">${row.buttonText || 'Learn More'}</span>
              </div>
            `;
            container.appendChild(card);
          } 
          else if (rowType === 'button') {
            const btn = document.createElement('a');
            btn.href = row.url || '#';
            btn.className = 'link-button';
            btn.target = '_blank';
            btn.innerHTML = `<span>${row.text || row.title || 'Link'}</span>`;
            container.appendChild(btn);
          }
        });
      })
      .catch(error => {
        console.error('Error loading data from Google Sheet:', error);
        document.getElementById('links-list-container').innerHTML = '<p style="text-align:center; color: #ffcccc;">Failed to load links.</p>';
      });
  </script>

</body>
</html>
